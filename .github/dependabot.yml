# Automatische Aktualisierung der Abhängigkeiten. Dependabot öffnet dafür Pull Requests,
# die der Build-Workflow (.github/workflows/build.yml) prüft.
version: 2
updates:
  # Maven: Spring Boot (Parent) und alle Bibliotheken aus pom.xml
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      # Spring Boot, Spring Modulith und Spring Security gemeinsam, sie hängen eng zusammen.
      spring:
        patterns:
          - "org.springframework*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      # Alle übrigen kleineren Updates in einem PR statt vieler einzelner.
      sonstige:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions in .github/workflows (checkout, setup-java, upload-artifact)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Container-Images in compose.yaml (dev, auch Quelle der Versionen für die Tests) und
  # betrieb/compose.yaml (Betriebspaket). Ein Update eines Images ändert beide Dateien im selben PR;
  # ComposeImagesTests prüft, dass sie gleich bleiben. Keycloak-Updates vor dem Merge lokal mit
  # Registrierung und Anmeldung testen; die Tests im Build laufen ohne Keycloak.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /betrieb
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      # Je Image ein PR über beide Verzeichnisse, PostgreSQL und Keycloak bleiben getrennt.
      images:
        group-by: dependency-name
        patterns:
          - "*"
    ignore:
      # Backend und Frontend: Deren Version setzt das Release (release.yml prüft sie). Die Images
      # sind außerdem privat, Dependabot könnte sie gar nicht lesen.
      - dependency-name: "*haushaltsbuch-backend"
      - dependency-name: "*haushaltsbuch-frontend"
      # Ein PostgreSQL-Major-Update braucht eine Migration der Daten (pg_upgrade oder Dump),
      # das Volume ist nicht kompatibel. Bewusst von Hand machen.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
