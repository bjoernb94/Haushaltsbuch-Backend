# Baut das Projekt und führt alle Tests aus (inkl. Testcontainers-Tests gegen PostgreSQL).
name: Build

on:
  # Nur main: Branches mit offenem PR (z. B. von Dependabot) baut bereits pull_request,
  # sonst liefe der Build doppelt.
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 25 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build und Tests
        run: ./mvnw -B verify

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
