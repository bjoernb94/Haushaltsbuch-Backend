# Baut das Projekt und führt alle Tests aus (inkl. Testcontainers-Tests gegen PostgreSQL).
name: Build

on:
  # Nur main: Branches mit offenem PR (z. B. von Dependabot) baut bereits pull_request,
  # sonst liefe der Build doppelt.
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 25 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build und Tests
        run: ./mvnw -B verify

      # ModularityTests schreibt die Modul-Doku nach docs/module. Weicht sie vom eingecheckten Stand ab
      # (geändert, neu oder gelöscht), wurde vergessen, die neu erzeugten Dateien zu committen.
      - name: Modul-Doku aktuell
        run: |
          if [ -n "$(git status --porcelain -- docs/module)" ]; then
            echo "::error::docs/module ist nicht aktuell. Lokal ./mvnw test -Dtest=ModularityTests ausführen und die Änderungen committen."
            git status --short -- docs/module
            git diff -- docs/module
            exit 1
          fi

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
