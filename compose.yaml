# Lokale Entwicklungsumgebung. Wird beim Start im dev-Profil automatisch durch
# Spring Boot Docker Compose Support hochgefahren. Alle Zugangsdaten sind reine
# Dev-Defaults und lassen sich über Umgebungsvariablen bzw. eine .env-Datei überschreiben.
services:
  postgres:
    image: 'postgres:18.6'
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-haushaltsbuch}'
      POSTGRES_USER: '${POSTGRES_USER:-haushaltsbuch}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-haushaltsbuch}'
      # Werden vom Init-Skript für die separate Keycloak-Datenbank verwendet.
      KEYCLOAK_DB: '${KEYCLOAK_DB:-keycloak}'
      KEYCLOAK_DB_USER: '${KEYCLOAK_DB_USER:-keycloak}'
      KEYCLOAK_DB_PASSWORD: '${KEYCLOAK_DB_PASSWORD:-keycloak}'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'
      - './docker/postgres/init:/docker-entrypoint-initdb.d:ro'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: 'quay.io/keycloak/keycloak:26.8.1'
    # Spielt den Realm haushaltsbuch aus docker/keycloak/import ein, sofern er noch nicht existiert.
    command: ['start-dev', '--import-realm']
    environment:
      # Client-Secret für den Realm-Import; muss zu KEYCLOAK_CLIENT_SECRET des Backends passen.
      KEYCLOAK_CLIENT_SECRET: '${KEYCLOAK_CLIENT_SECRET:-dev-secret}'
      KC_BOOTSTRAP_ADMIN_USERNAME: '${KEYCLOAK_ADMIN:-admin}'
      KC_BOOTSTRAP_ADMIN_PASSWORD: '${KEYCLOAK_ADMIN_PASSWORD:-admin}'
      KC_DB: 'postgres'
      KC_DB_URL: 'jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}'
      KC_DB_USERNAME: '${KEYCLOAK_DB_USER:-keycloak}'
      KC_DB_PASSWORD: '${KEYCLOAK_DB_PASSWORD:-keycloak}'
      KC_HTTP_PORT: '8080'
    ports:
      - '${KEYCLOAK_PORT:-8180}:8080'
    volumes:
      - './docker/keycloak/import:/opt/keycloak/data/import:ro'
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      # Keine Service-Connection für Keycloak ableiten; die Anbindung erfolgt über application.yml.
      org.springframework.boot.ignore: 'true'

volumes:
  postgres-data:
