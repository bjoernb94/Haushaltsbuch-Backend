# Startet die ganze Anwendung aus den veröffentlichten Images (docs/betrieb.md, Betrieb per Compose).
# Nicht für das offene Internet: Keycloak läuft ohne HTTPS, TLS und Reverse Proxy folgen mit v1.0.0
# (#7, #17). Erreichbar ist nur das Frontend; Backend, Keycloak und PostgreSQL bleiben im internen Netz.
# Pflichtangaben stehen in .env (Vorlage: .env.beispiel); fehlt eine, bricht Compose mit einer Meldung ab.
name: haushaltsbuch

services:
  postgres:
    image: 'postgres:18.6'
    restart: unless-stopped
    environment:
      POSTGRES_DB: 'haushaltsbuch'
      POSTGRES_USER: 'haushaltsbuch'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}'
      # Für das Init-Skript, das beim ersten Start die Keycloak-Datenbank anlegt.
      KEYCLOAK_DB: 'keycloak'
      KEYCLOAK_DB_USER: 'keycloak'
      KEYCLOAK_DB_PASSWORD: '${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD in .env setzen}'
    volumes:
      - 'postgres-data:/var/lib/postgresql'
      - './postgres/init:/docker-entrypoint-initdb.d:ro,Z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: 'quay.io/keycloak/keycloak:26.8.1'
    restart: unless-stopped
    # Produktionsmodus, aber nur per HTTP im internen Netz; der Realm wird beim ersten Start importiert.
    command: ['start', '--import-realm', '--http-enabled=true', '--hostname-strict=false']
    environment:
      KEYCLOAK_CLIENT_SECRET: '${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET in .env setzen}'
      KC_BOOTSTRAP_ADMIN_USERNAME: 'admin'
      KC_BOOTSTRAP_ADMIN_PASSWORD: '${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD in .env setzen}'
      KC_DB: 'postgres'
      KC_DB_URL: 'jdbc:postgresql://postgres:5432/keycloak'
      KC_DB_USERNAME: 'keycloak'
      KC_DB_PASSWORD: '${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD in .env setzen}'
      KC_HTTP_PORT: '8080'
    volumes:
      - './keycloak/import:/opt/keycloak/data/import:ro,Z'
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: 'ghcr.io/bjoernb94/haushaltsbuch-backend:0.1.0'
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: 'prod'
      HAUSHALTSBUCH_STAGE: '${HAUSHALTSBUCH_STAGE:?HAUSHALTSBUCH_STAGE in .env setzen (DEV oder PROD)}'
      DB_URL: 'jdbc:postgresql://postgres:5432/haushaltsbuch'
      DB_USERNAME: 'haushaltsbuch'
      DB_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}'
      KEYCLOAK_ISSUER_URI: 'http://keycloak:8080/realms/haushaltsbuch'
      KEYCLOAK_CLIENT_ID: 'haushaltsbuch-backend'
      KEYCLOAK_CLIENT_SECRET: '${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET in .env setzen}'
      KEYCLOAK_ADMIN_URI: 'http://keycloak:8080/admin/realms/haushaltsbuch'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    image: 'ghcr.io/bjoernb94/haushaltsbuch-frontend:0.1.0'
    restart: unless-stopped
    environment:
      BACKEND_URL: 'http://backend:8080'
    # Auf allen Adressen, damit die Anwendung im Heimnetz erreichbar ist.
    ports:
      - '${HAUSHALTSBUCH_PORT:-8080}:8080'
    volumes:
      # Angaben des Betreibers für Impressum und Datenschutz (Format im README des Frontends).
      - './instanz.json:/usr/share/nginx/html/instanz.json:ro,Z'
    depends_on:
      - backend

volumes:
  postgres-data:
