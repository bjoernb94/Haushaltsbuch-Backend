spring:
  application:
    name: Haushaltsbuch-Backend
  profiles:
    # Ohne SPRING_PROFILES_ACTIVE läuft die Anwendung lokal im dev-Profil.
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema wird ausschließlich über Flyway gepflegt.
      ddl-auto: validate
      naming:
        # Spalten eingebetteter Werte mit Feldnamen als Präfix, z. B. Betrag preis → preis_wert,
        # preis_waehrung; so passen mehrere Beträge in eine Tabelle.
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
    properties:
      hibernate:
        # Zeitstempel (Instant) unabhängig von der Zeitzone des Servers in UTC speichern.
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  # Keycloak-Anbindung; die Werte stehen unter haushaltsbuch.keycloak (je Profil).
  security:
    oauth2:
      # Die Anmeldung der Nutzer läuft nicht über Spring-OAuth2-Login, sondern über
      # POST /api/anmeldung (siehe Anmeldung, KeycloakTokenClient).
      client:
        registration:
          # Service Account für die Keycloak Admin API (Registrierung, siehe KeycloakAdminConfig).
          # Der Client braucht dafür "Service accounts roles" und die Rolle realm-management/manage-users.
          keycloak-admin:
            provider: keycloak
            client-id: ${haushaltsbuch.keycloak.client-id}
            client-secret: ${haushaltsbuch.keycloak.client-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            # Endpunkt explizit statt über issuer-uri, damit der Start nicht
            # von der Erreichbarkeit von Keycloak (OIDC-Discovery) abhängt.
            token-uri: ${haushaltsbuch.keycloak.issuer-uri}/protocol/openid-connect/token

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    git:
      mode: simple
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Status für die Login-Seite der SPA: öffentlich, nur UP/DOWN je Komponente, ohne Details.
        systemstatus:
          include: db, keycloak
          show-components: always
          show-details: never

haushaltsbuch:
  security:
    openapi-public: false

# OpenAPI-Beschreibung, eingecheckt als docs/openapi.json: sortiert und eingerückt, damit der Diff
# nur echte Änderungen zeigt; Antworten als JSON statt */*. @Nullable an Record-Feldern als nullable beschreiben.
springdoc:
  model-converters:
    java-nullable-property-customizer:
      enabled: true
  default-produces-media-type: application/json
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

---
spring:
  config:
    activate:
      on-profile: dev
  # Docker Compose Support ist aus: Die Umgebung aus compose.yaml startet getrennt („Umgebung starten“),
  # damit ein Neustart des Backends die Datenbank nicht mit neu startet. Auf true setzen, um sie mitzustarten.
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
      lifecycle-management: start-only
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/haushaltsbuch}
    username: ${DB_USERNAME:haushaltsbuch}
    password: ${DB_PASSWORD:haushaltsbuch}

management:
  endpoint:
    health:
      show-details: always

haushaltsbuch:
  stage: ${HAUSHALTSBUCH_STAGE:DEV}
  keycloak:
    # Einrichtung von Realm und Client: siehe docs/betrieb.md, Abschnitt "Keycloak einrichten".
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/haushaltsbuch}
    client-id: ${KEYCLOAK_CLIENT_ID:haushaltsbuch-backend}
    # Passt zum Realm-Import (docker/keycloak/import); nur für dev.
    client-secret: ${KEYCLOAK_CLIENT_SECRET:dev-secret}
    # Admin REST API des Realms, über die die Registrierung Konten anlegt.
    admin-uri: ${KEYCLOAK_ADMIN_URI:http://localhost:8180/admin/realms/haushaltsbuch}
  security:
    openapi-public: true

---
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false

haushaltsbuch:
  stage: ${HAUSHALTSBUCH_STAGE}
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
    client-id: ${KEYCLOAK_CLIENT_ID}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
    admin-uri: ${KEYCLOAK_ADMIN_URI}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
